[package]
name = "parse"
version = "0.1.0"
edition = "2021"

[dependencies]
model = { path = "../model" }
pricer = { path = "../pricer" }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
hex = "0.4"
calamine = { version = "0.36", features = ["dates"] }
regex = "1"
once_cell = "1"

[dev-dependencies]
rust_xlsxwriter = "0.100.0"
