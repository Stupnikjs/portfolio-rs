[package]
name = "portfolio_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
csv = "1"
sha2 = "0.10"
hex = "0.4"
calamine = { version = "0.24", features = ["dates"] }
regex = "1"
once_cell = "1"
url = "=2.5.0"
idna = "=0.5.0"
indexmap = "=2.2.6"
encoding_rs = "=0.8.33"
